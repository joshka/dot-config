name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The build validates src/data/tools.yaml against the schema in
    # src/content.config.ts, so a bad tool entry fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1.52.2

  # Audits the workflows and Dependabot config for security problems.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          # Fail the job on findings instead of uploading to code scanning.
          advanced-security: false
          annotations: true

  # Checks that .github/workflows/actions.lock matches the workflows. After changing a uses: line,
  # run `gh actions-lock` and commit both files.
  lockfile:
    name: actions lockfile
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # The single merge gate: require only this check in branch protection, and add any new job that
  # must pass to its needs.
  required:
    if: ${{ always() }}
    needs: [build, typos, zizmor, lockfile]
    runs-on: ubuntu-slim
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
